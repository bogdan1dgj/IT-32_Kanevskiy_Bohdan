<h2>Список фільмів</h2>

<div class="movie-list">
  @for (movie of movies; track movie.id) {
    <article>
      <h3>{{ movie.title }}</h3>
      <p>Режисер: {{ movie.director }}</p>

      <a [routerLink]="['/movie', movie.id]">
        Детальніше
      </a>
    </article>
  }
</div>

<a routerLink="/movies/add">Додати новий фільм</a>
