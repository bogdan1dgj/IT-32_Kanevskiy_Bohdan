<h1>Каталог товарів</h1>

<h2>Додати товар</h2>

<div class="form">

  <input
    type="text"
    placeholder="Назва товару"
    [(ngModel)]="newName"
  >

  <input
    type="number"
    placeholder="Ціна"
    [(ngModel)]="newPrice"
  >

  <input
    type="number"
    placeholder="Кількість"
    [(ngModel)]="newQuantity"
  >

  <button
    (click)="addProduct()"
    [disabled]="newName.trim() === ''"
  >
    Додати товар
  </button>

</div>

<h2>Список товарів</h2>

<div
  class="product"
  *ngFor="let product of products()"
>

  <h3>{{ product.name }}</h3>

  <p>Ціна: {{ product.price }} грн</p>

  <p>Кількість: {{ product.quantity }}</p>

  <button (click)="removeProduct(product.id)">
    Видалити
  </button>

</div>
