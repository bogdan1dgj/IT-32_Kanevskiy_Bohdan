<h1>Каталог товарів</h1>

<p>Всього товарів: {{ products.length }}</p>

<h2>Додати товар</h2>

<div class="form">

  <input
    type="text"
    placeholder="Назва товару"
    [(ngModel)]="newName"
  >

  <input
    type="number"
    placeholder="Ціна"
    [(ngModel)]="newPrice"
  >

  <input
    type="number"
    placeholder="Кількість"
    [(ngModel)]="newQuantity"
  >

  <button
    (click)="addProduct()"
    [disabled]="newName.trim() === ''"
  >
    Додати товар
  </button>

</div>

<h2>Список товарів</h2>

<div
  *ngFor="let product of products; let i = index"
  [ngClass]="product.quantity > 0 ? 'available' : 'not-available'"
>

  <h3>{{ product.name }}</h3>

  <p>Ціна: {{ product.price }} грн</p>

  <p>Кількість: {{ product.quantity }}</p>

  <p *ngIf="product.quantity > 0">
    Є в наявності
  </p>

  <p *ngIf="product.quantity === 0">
    Немає в наявності
  </p>

  <button (click)="deleteProduct(i)">
    Видалити
  </button>

</div>
